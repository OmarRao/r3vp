# One-command local dev stack for R3VP.
#
#   docker compose up --build
#
# Brings up Postgres, Redis, and the API. On start the api service applies all
# database migrations and loads the demo dataset (idempotent), then serves on
# http://localhost:8000 with a fully populated database. Set SEED_DEMO=0 to
# skip seeding.
#
# The portal is intentionally omitted: it requires Auth0 credentials. See the
# README "Portal" section to run it locally against this API.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: r3vp
      POSTGRES_PASSWORD: r3vp
      POSTGRES_DB: r3vp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r3vp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./apps/api
    command:
      - sh
      - -c
      - |
        set -e
        uv run alembic upgrade head
        if [ "$${SEED_DEMO:-1}" = "1" ]; then uv run python -m src.scripts.seed_demo; fi
        uv run uvicorn src.main:app --host 0.0.0.0 --port 8000
    environment:
      R3VP_API_DATABASE_URL: postgresql+asyncpg://r3vp:r3vp@db:5432/r3vp
      R3VP_API_REDIS_URL: redis://redis:6379/0
      SEED_DEMO: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
